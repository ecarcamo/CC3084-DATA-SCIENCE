services:
  pyspark:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lab7-pyspark
    ports:
      - "8888:8888"
    volumes:
      - ..:/opt/app/repo
    working_dir: /opt/app/repo
    environment:
      JAVA_HOME: /opt/java-home
      PYSPARK_PYTHON: /usr/local/bin/python
    command:
      - jupyter
      - notebook
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --ServerApp.token=
      - --notebook-dir=/opt/app/repo
